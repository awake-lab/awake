[versions]
kotlin = "2.4.0"
agp = "9.2.1"
compose-multiplatform = "1.11.1"
compose-material3 = "1.9.0"
detekt = "1.23.8"
spotless = "7.0.2"
dokka = "2.0.0"
download = "5.6.0"
fleks = "2.14"
artemis-odb = "2.3.0"
ashley = "1.7.3"
lwjgl = "3.3.6"
kotlinx-benchmark = "0.4.17"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.10.2"
kotlinx-browser = "0.5.0"
napier = "2.7.1"
androidx-activity-compose = "1.9.3"
androidx-appcompat = "1.7.0"
androidx-core-ktx = "1.15.0"
material-icons = "1.7.3"
leakcanary = "2.14"
# vanniktech-publish is applied directly in awake-core/build.gradle.kts.
vanniktech-publish = "0.36.0"
# Phase 2.5 (Web/WebGPU) spike -- no stable release yet (last tag v0.1.1, June 2025), this
# is a Sonatype snapshot build (see settings.gradle.kts's snapshot repo addition).
wgpu4k = "0.2.0-SNAPSHOT"
# MVP1a NavMesh slice -- pure-Java Recast/Detour port, JVM-only (desktop+Android), see
# docs/MMORPG_ROADMAP.md's NavMesh decision.
recast4j = "1.5.11"

[libraries]
wgpu4k = { module = "io.ygdrasil:wgpu4k", version.ref = "wgpu4k" }
# wgpu4k-toolkit has the canvas/adapter/device bootstrap helpers (canvasContextRenderer,
# WGPUContext) the core wgpu4k module doesn't -- see wgpu4k-toolkit/src/webMain/kotlin/
# Surface.kt in the wgpu4k repo.
wgpu4k-toolkit = { module = "io.ygdrasil:wgpu4k-toolkit", version.ref = "wgpu4k" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
napier = { module = "io.github.aakira:napier", version.ref = "napier" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "material-icons" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
fleks = { module = "io.github.quillraven.fleks:Fleks", version.ref = "fleks" }
artemis-odb = { module = "net.onedaybeard.artemis:artemis-odb", version.ref = "artemis-odb" }
ashley = { module = "com.badlogicgames.ashley:ashley", version.ref = "ashley" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinx-benchmark" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# Provides Dispatchers.Main on plain-JVM desktop -- without it, MainScope().launch (used by
# VulkanApplication.create()/WebGpuApplication.create() since the suspend-scene-loading
# refactor) throws "Module with the Main dispatcher is missing" at runtime. Not caught
# earlier because that refactor's own verification used iOS Simulator, not this module's
# actual desktop run tasks.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
# Wraps browser fetch()/DOM APIs for Kotlin/Wasm -- used by awake-base's wasmJs
# readResourceBytes actual (see docs/MVP_PLAN.md's web-demo decision log entry).
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
download-gradle-plugin = { module = "de.undercouch:gradle-download-task", version.ref = "download" }
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
lwjgl = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw", version.ref = "lwjgl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl" }
lwjgl-stb = { module = "org.lwjgl:lwjgl-stb", version.ref = "lwjgl" }
recast4j-recast = { module = "org.recast4j:recast", version.ref = "recast4j" }
recast4j-detour = { module = "org.recast4j:detour", version.ref = "recast4j" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-library-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinx-benchmark" }
