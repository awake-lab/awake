<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Awake Studio proposed layout</title>
  <desc id="desc">Top bar with scene tabs on the left and a Play toggle on the right; a hierarchy dock on the left; a viewport with a header strip for camera mode, projection, wireframe and shadows, and a floating tool pill on its left edge; an inspector dock on the right; a tabbed bottom dock for console, timeline and assets; and a status bar.</desc>

  <style>
    .p { fill: #1a1a1a; font-family: system-ui, sans-serif; font-size: 12px; }
    .m { fill: #6b6b6b; font-family: system-ui, sans-serif; font-size: 12px; }
    .s { fill: #8a8a8a; font-family: system-ui, sans-serif; font-size: 11px; }
    .b { fill: #1a1a1a; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 500; }
    .box { fill: none; stroke: #d0d0d0; stroke-width: 1; }
    .fillbox { fill: #f4f4f4; stroke: #d0d0d0; stroke-width: 1; }
    .sel { fill: #e8e8e8; stroke: #b8b8b8; stroke-width: 1; }
    .rule { stroke: #d0d0d0; stroke-width: 1; }
  </style>

  <rect x="10" y="10" width="880" height="450" rx="8" class="box"/>

