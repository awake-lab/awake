name: Publish

on:
  push:
    branches:
      - main

env:
  XCODE_VERSION: '14.2'
  # Must match awake-core's jvmToolchain(17) -- publishing needs to compile everything first.
  JAVA_VERSION: '17'
  # CI_MAVEN_USERNAME/PASSWORD are now a Central Portal user token (central.sonatype.com/
  # account), not the legacy Sonatype JIRA account OSSRH staging used -- same secret names,
  # different underlying credential, since Sonatype sunset OSSRH in June 2025.
  MAVEN_CENTRAL_USERNAME: ${{ secrets.CI_MAVEN_USERNAME }}
  MAVEN_CENTRAL_PASSWORD: ${{ secrets.CI_MAVEN_PASSWORD }}
  SIGNING_KEY_ID: ${{ secrets.CI_SIGNING_KEY_ID }}
  SIGNING_PASSWORD: ${{ secrets.CI_SIGNING_PASSWORD }}
  SIGNING_KEY: ${{ secrets.CI_SIGNING_KEY }}

jobs:
#   build:
#     runs-on: macos-latest

#     steps:
#       - name: Checkout code
#         uses: actions/checkout@v3
#       - name: Setup Java
#         uses: actions/setup-java@v1
#         with:
#           java-version: ${{ env.JAVA_VERSION }}
#       - name: Select Xcode version
#         uses: maxim-lobanov/setup-xcode@v1
#         with:
#           xcode-version: ${{ env.XCODE_VERSION }}
#       - name: Set up Gradle
#         uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
#       - name: Build
#         run: |
#           gradle build

  publish:
    runs-on: macos-latest
#     needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v1
        with:
         java-version: ${{ env.JAVA_VERSION }}
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Set up Gradle
        uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
      - name: Publish to Maven Central
        run: |
          echo "mavenCentralUsername=$MAVEN_CENTRAL_USERNAME" >> local.properties
          echo "mavenCentralPassword=$MAVEN_CENTRAL_PASSWORD" >> local.properties
          echo "signingInMemoryKeyId=$SIGNING_KEY_ID" >> local.properties
          echo "signingInMemoryKeyPassword=$SIGNING_PASSWORD" >> local.properties
          echo "signingInMemoryKey=$SIGNING_KEY" >> local.properties
          gradle publishToMavenCentral -PisMainHost=true --no-configuration-cache
