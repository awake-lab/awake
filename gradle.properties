#Gradle
org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
# Independent module subgraphs build concurrently instead of serially -- real win on a 30+
# module tree. workers.max capped well below the machine's core count: each parallel module
# build can spawn its own Kotlin compiler daemon (up to the 4096M heap above), so uncapped
# parallelism risks memory pressure/thrashing rather than a speedup on a machine with 18GB RAM.
org.gradle.parallel=true
org.gradle.workers.max=4
# Pin the Gradle daemon/build JVM to 21 -- the system `java` on PATH resolves to Homebrew's
# unversioned `openjdk` formula, which tracks whatever the latest JDK release is (26.0.2 as of
# writing) and isn't pinned by this repo anywhere else. Kotlin 2.4.0 doesn't yet target JDK 26
# (falls back to JVM_25 with a warning on every build) and detekt hard-crashes on it entirely.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Dokka 2.x plugin mode
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
#Android
android.useAndroidX=true
android.compileSdk=35
android.targetSdk=35
android.minSdk=33
